<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA // Swarm Live</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">NOVA <span>SWARM LIVE</span></div>
        <div class="stats">Equity: <span id="equity">--</span></div>
    </header>

    <main>
        <!-- LEFT COLUMN -->
        <aside class="left-panel">
            <div class="panel">
                <h2>ACTIVE TRADE</h2>
                <div id="active-trade" class="content">No open trade</div>
            </div>
            <div class="panel">
                <h2>METRICS</h2>
                <ul class="metrics">
                    <li>Daily P&L <span id="daily-pnl">--</span></li>
                    <li>Win Rate <span id="win-rate">--</span></li>
                    <li>Equity <span id="equity-2">--</span></li>
                    <li>Closed <span id="closed">--</span></li>
                </ul>
            </div>
        </aside>

        <!-- CENTER SWARM -->
        <section class="center-panel">
            <div class="panel swarm-panel">
                <h2>SWARM TOPOLOGY</h2>
                <div id="swarm-container" class="swarm-container">
                    <!-- The glowing background grid -->
                    <div class="grid-bg"></div>
                    
                    <!-- SVG Lines -->
                    <svg id="swarm-svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet">
                        <!-- Defining paths for the data packets to travel on -->
                        <path id="path-scout-guard" d="M 200 450 L 300 150" class="line" />
                        <path id="path-guard-strat" d="M 300 150 L 500 150" class="line" />
                        <path id="path-strat-risk" d="M 500 150 L 600 450" class="line" />
                        <path id="path-risk-trader" d="M 600 450 L 400 500" class="line" />
                        <path id="path-trader-chief" d="M 400 500 L 400 300" class="line" />
                    </svg>

                    <!-- Nodes -->
                    <div class="node" id="node-SCOUT" style="left: 25%; top: 75%;">SCOUT</div>
                    <div class="node" id="node-GUARD" style="left: 37.5%; top: 25%;">GUARD</div>
                    <div class="node" id="node-STRATEGIST" style="left: 62.5%; top: 25%;">STRAT</div>
                    <div class="node" id="node-RISK" style="left: 75%; top: 75%;">RISK</div>
                    <div class="node" id="node-TRADER" style="left: 50%; top: 83.3%;">TRADER</div>
                    
                    <div class="node chief" id="node-CHIEF" style="left: 50%; top: 50%;">CHIEF</div>

                    <!-- The moving data packet -->
                    <div id="data-packet" class="data-packet"></div>
                </div>
            </div>
        </section>

        <!-- RIGHT COLUMN -->
        <aside class="right-panel">
            <div class="panel log-panel">
                <h2>AGENT LOGS</h2>
                <div id="agent-logs" class="logs"></div>
            </div>
            <div class="panel">
                <h2>CHIEF AI BRIEFING</h2>
                <div id="chief-briefing" class="content calm">Waiting...</div>
            </div>
        </aside>
    </main>
    
    <button id="pause-btn">PAUSE</button>

    <script src="app.js"></script>
</body>
</html>
