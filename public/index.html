<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GROK BOT TRADING DESK</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="desk">
  <header class="top">
    <div class="brand">
      <div class="logo">G</div>
      GROK BOT TRADING DESK
    </div>
    <div class="live"><span class="dot"></span> LIVE</div>
    <div class="balance" id="equity">$1.0000</div>
  </header>
  <div class="subtitle">22 AGENTS · ONE GROK · MEME SIGNALS · 22/22 ONLINE</div>

  <div class="orbitals" id="orbitals">
    <svg id="svg" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet">
      <defs>
        <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <radialGradient id="coreg" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#1a0a30"/>
          <stop offset="100%" stop-color="#050510"/>
        </radialGradient>
      </defs>
      <path id="p1" d="M 100 80 C 200 20, 320 40, 500 250" class="line green"/>
      <path id="p2" d="M 250 60 C 340 10, 420 30, 500 250" class="line cyan"/>
      <path id="p3" d="M 750 60 C 660 10, 580 30, 500 250" class="line purple"/>
      <path id="p4" d="M 900 90 C 800 30, 620 50, 500 250" class="line magenta"/>
      <path id="p5" d="M 900 410 C 800 470, 620 450, 500 250" class="line green"/>
      <path id="p6" d="M 750 440 C 660 490, 580 470, 500 250" class="line cyan"/>
      <path id="p7" d="M 250 440 C 340 490, 420 470, 500 250" class="line purple"/>
      <path id="p8" d="M 100 420 C 200 480, 320 460, 500 250" class="line magenta"/>
      <circle cx="500" cy="250" r="55" fill="url(#coreg)" stroke="#00f0ff" stroke-width="1.8" filter="url(#glow)"/>
    </svg>

    <div class="core">
      <div class="eyes"><span></span><span></span></div>
    </div>

    <div class="agent a1" data-n="SCOUT">SCOUT</div>
    <div class="agent a2" data-n="GUARD">GUARD</div>
    <div class="agent a3" data-n="STRAT">STRAT</div>
    <div class="agent a4" data-n="RISK">RISK</div>
    <div class="agent a5" data-n="TRADER">TRADER</div>
    <div class="agent a6" data-n="KELLY">KELLY</div>
    <div class="agent a7" data-n="EDGE">EDGE</div>
    <div class="agent a8" data-n="PRIOR">PRIOR</div>

    <div class="pkt" id="pkt"></div>
  </div>

  <div class="bottom">
    <div class="panel chart-panel">
      <div class="ph">
        <span id="token">SCANNING</span>
        <span class="hold">HOLDING</span>
      </div>
      <canvas id="candle"></canvas>
      <div class="tinfo">
        <span>Entry <b id="entry">--</b></span>
        <span>Size <b>0.02 SOL</b></span>
        <span>PnL <b id="pnl" class="pos">+0.0000</b></span>
      </div>
    </div>
    <div class="panel">
      <div class="ph">TRADES · SPOT <span class="closed">0 closed</span></div>
      <div id="trades" class="list"></div>
    </div>
    <div class="panel">
      <div class="ph">AGENT LOGS</div>
      <div id="logs" class="list"></div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
