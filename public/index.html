<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORBITALS // SOLANA PAPER</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="terminal">
  <header class="top-bar">
    <div class="brand">ORBITALS <span>// SOLANA</span></div>
    <div class="metrics">
      <div class="metric"><span>EQUITY</span><strong id="equity">--</strong></div>
      <div class="metric"><span>PNL</span><strong id="pnl">--</strong></div>
      <div class="metric"><span>WIN RATE</span><strong id="wr">--</strong></div>
      <div class="metric"><span>AGENTS</span><strong class="online">6/6</strong></div>
      <div class="metric"><span>MODE</span><strong>PAPER</strong></div>
    </div>
  </header>

  <section class="orbitals">
    <svg id="orbit-svg" viewBox="0 0 900 580" preserveAspectRatio="xMidYMid meet">
      <defs>
        <filter id="glow"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <path id="p-scout" d="M 150 140 C 250 60, 380 100, 450 290" class="path cyan"/>
      <path id="p-guard" d="M 450 100 C 500 40, 580 80, 450 290" class="path magenta"/>
      <path id="p-strat" d="M 750 140 C 650 50, 540 110, 450 290" class="path purple"/>
      <path id="p-risk" d="M 750 440 C 650 530, 540 470, 450 290" class="path cyan"/>
      <path id="p-trader" d="M 450 480 C 380 540, 280 500, 450 290" class="path magenta"/>
      <path id="p-chief" d="M 150 440 C 230 520, 360 470, 450 290" class="path purple"/>
      <path id="x1" d="M 150 140 C 280 180, 360 220, 450 290" class="path cyan thin"/>
      <path id="x2" d="M 750 140 C 620 200, 540 240, 450 290" class="path magenta thin"/>
    </svg>

    <div class="node core" id="node-CHIEF">CHIEF</div>
    <div class="node agent" id="node-SCOUT" style="left:16.7%;top:24%">SCOUT</div>
    <div class="node agent" id="node-GUARD" style="left:50%;top:17%">GUARD</div>
    <div class="node agent" id="node-STRATEGIST" style="left:83.3%;top:24%">STRAT</div>
    <div class="node agent" id="node-RISK" style="left:83.3%;top:76%">RISK</div>
    <div class="node agent" id="node-TRADER" style="left:50%;top:83%">TRADER</div>

    <div class="packet" id="pkt1"></div>
    <div class="packet" id="pkt2"></div>
    <div class="packet" id="pkt3"></div>
  </section>

  <section class="charts">
    <div class="chart-panel"><h3>PNL CURVE</h3><canvas id="pnlChart"></canvas></div>
    <div class="chart-panel"><h3>PRICE ACTION</h3><canvas id="candleChart"></canvas></div>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
