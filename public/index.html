<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GROK BOT // 24/7 DESK</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="hud">
  <header class="top">
    <div class="brand">GROK BOT // 24/7 DESK</div>
    <div class="tickers">
      <span>EQ <strong id="eq">2.0000</strong></span>
      <span>PNL <strong id="pnl" class="pos">+0.0000</strong></span>
      <span>WR <strong id="wr">0%</strong></span>
      <span>TRADES <strong id="trades">0</strong></span>
      <span class="live"><span class="dot"></span> LIVE</span>
    </div>
  </header>

  <main class="grid">
    <aside class="col left">
      <div class="panel">
        <h3>EDGE RANKER</h3>
        <table class="dense">
          <thead><tr><th>TOKEN</th><th>DIR</th><th>EDGE</th></tr></thead>
          <tbody id="ranker"></tbody>
        </table>
      </div>
      <div class="panel">
        <h3>EXECUTION TRACE</h3>
        <div id="trace" class="trace"></div>
      </div>
    </aside>

    <section class="col center">
      <div class="panel ring-panel">
        <h3>AGENT ENSEMBLE RING</h3>
        <div class="ring-wrap">
          <div class="ring r1"></div>
          <div class="ring r2"></div>
          <div class="ring r3"></div>
          <div class="core" id="core-content">GROK</div>
        </div>
        <div class="agents-row" id="agents-row"></div>
      </div>
    </section>

    <aside class="col right">
      <div class="panel">
        <h3>LIVE POSITIONS</h3>
        <div id="positions" class="positions">NO ACTIVE TRADES</div>
      </div>
      <div class="panel">
        <h3>STATE ESTIMATOR</h3>
        <canvas id="volChart"></canvas>
      </div>
    </aside>

    <section class="bottom">
      <div class="panel">
        <h3>TRADE PREP</h3>
        <canvas id="candleChart"></canvas>
      </div>
      <div class="panel">
        <h3>FLOW PHASE</h3>
        <canvas id="flowChart"></canvas>
      </div>
    </section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
